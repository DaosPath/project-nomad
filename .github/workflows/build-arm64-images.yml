# Fork ARM64: build linux/arm64 images to ghcr.io/DaosPath (upstream ships amd64-only).
# Run manually from the arm64 branch. QEMU-emulated ARM build (~30-60 min for admin).
name: Build ARM64 Images (fork)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the ARM images (e.g. "latest" or "1.2.3-arm64")'
        required: true
        type: string
        default: 'latest-arm64'

jobs:
  build:
    name: Build + push linux/arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin
            context: .
            dockerfile: ./Dockerfile
            image: ghcr.io/daospath/project-nomad
          - name: sidecar-updater
            context: install/sidecar-updater
            dockerfile: install/sidecar-updater/Dockerfile
            image: ghcr.io/daospath/project-nomad-sidecar-updater
          - name: disk-collector
            context: install/sidecar-disk-collector
            dockerfile: install/sidecar-disk-collector/Dockerfile
            image: ghcr.io/daospath/project-nomad-disk-collector
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }} (arm64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
